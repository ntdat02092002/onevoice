audio:
  sample_rate: 16000
  frame_ms: 20
  asr_chunk_ms: 500
  queue_seconds: 20
vad:
  backend: webrtc
  aggressiveness: 2
  min_speech_ms: 250
  end_silence_ms: 600
  speech_padding_ms: 200
  max_utterance_seconds: 15
  semantic_endpoint_enabled: true
  semantic_endpoint_sentences: 2
  semantic_endpoint_context_ms: null
asr:
  backend: moonshine
  model: auto
  device: cpu
  compute_type: int8
  language: vi
  beam_size: 1
  model_dir: null
  update_interval: 0.5
  decoding_method: attention
  offline: false
  sherpa:
    recognizer_mode: online_transducer
    provider: cpu
    num_threads: 2
    decoding_method: greedy_search
    max_active_paths: 4
    final_padding_ms: 500
    cache_dir: .cache/onevoice/asr
    punctuation_enabled: true
commit:
  backend: local_agreement
  agreement_updates: 2
  hold_tokens: 1
translation:
  backend: opus_ct2
  model: opus-auto
  device: cpu
  compute_type: int8
  model_dir: null
  source_language: vi
  target_language: en
  wait_tokens: 6
  update_tokens: 4
  timeout_ms: 1200
  min_request_interval_ms: 500
  zh_wait_tokens: 12
  zh_update_tokens: 8
  zh_timeout_ms: 1000
  max_new_tokens: 256
  sentence_boundary_only: false
  offline: false
tts:
  enabled: false
  backend: sherpa_onnx
  model: auto
  model_dir: null
  tokens: null
  lexicon: null
  data_dir: null
  rule_fsts: []
  language: auto
  cache_dir: .cache/onevoice/tts
  offline: false
  device: cpu
  num_threads: 2
  speaker_id: 0
  speed: 0.9
  num_steps: 8
  min_chunk_tokens: 8
  max_chunk_tokens: 24
  agreement_updates: 2
  timeout_ms: 1200
  sentence_boundary_only: true
  final_only: true
  emission_mode: final_utterance
terminology:
  enabled: false
  bundle_path: null
  domain: null
  matching:
    normalization: unicode_nfc
    longest_match_first: true
    case_sensitive_for_codes: true
  mt:
    strategy: placeholder_with_validation
    placeholder_formats:
      - "__TERM_{id:04d}__"
      - "OVT{id:04d}OVT"
      - "ZXTERM{id:04d}ZX"
    validate_coverage: true
    pivot_canonicalization: true
    validate_order: false
    on_validation_error: segment_fallback
